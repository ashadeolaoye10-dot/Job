<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job - Unicorn Innovations Hill Limited</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="Admin-edit-job.css">
</head>

<body>

<div class="edit-container">

    <div class="edit-header">

        <a href="Admin-dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </a>

        <h1>
            <i class="fa-solid fa-pen-to-square"></i>
            Edit Job
        </h1>

        <p>
            Update the job information below.
        </p>

    </div>


    <form id="editJobForm">

        <input type="hidden" id="jobId">


        <div class="form-group">

            <label for="jobTitle">
                Job Title
            </label>

            <input
                type="text"
                id="jobTitle"
                required
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="jobCategory">
                    Category
                </label>

                <select id="jobCategory" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Human Resources">
                        Human Resources
                    </option>

                    <option value="Engineering">
                        Engineering
                    </option>

                    <option value="Sales">
                        Sales
                    </option>

                    <option value="Administration">
                        Administration
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="jobType">
                    Employment Type
                </label>

                <select id="jobType" required>

                    <option value="">
                        Select Type
                    </option>

                    <option value="Full Time">
                        Full Time
                    </option>

                    <option value="Part Time">
                        Part Time
                    </option>

                    <option value="Contract">
                        Contract
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                    <option value="Remote">
                        Remote
                    </option>

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="jobLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="jobLocation"
                    required
                >

            </div>


            <div class="form-group">

                <label for="jobSalary">
                    Salary
                </label>

                <input
                    type="text"
                    id="jobSalary"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="jobDescription">
                Job Description
            </label>

            <textarea
                id="jobDescription"
                rows="7"
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="jobRequirements">
                Requirements
            </label>

            <textarea
                id="jobRequirements"
                rows="7"
                required
            ></textarea>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="applicationDeadline">
                    Application Deadline
                </label>

                <input
                    type="date"
                    id="applicationDeadline"
                >

            </div>


            <div class="form-group">

                <label for="numberOfOpenings">
                    Number of Openings
                </label>

                <input
                    type="number"
                    id="numberOfOpenings"
                    min="1"
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="Admin-dashboard.html"
                class="cancel-btn"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="save-btn"
            >

                <i class="fa-solid fa-floppy-disk"></i>

                Save Changes

            </button>

        </div>

    </form>

</div>


<script src="Admin-edit-job.js"></script>

</body>
</html>
